<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            color: #333;
        }

        header {
            background-color: #1f3c88;
            color: white;
            padding: 15px 30px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>
<header>
    <h2>Sistema de Actividades</h2>
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'actividades' %}">Actividades</a>
        <a href="{% url 'crear_actividad' %}">Crear</a>
        <a href="{% url 'iniciar_sesion' %}">Salir</a>
    </nav>
</header>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
