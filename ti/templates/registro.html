{% extends 'base.html' %}
{% block title %}Registro - Sistema de Gestión de Actividades{% endblock %}
{% block content %}
<main class="container-main">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <h2 class="text-center mb-3" style="color: var(--primary-color);">Crear cuenta</h2>

          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" id="email" name="email" class="form-control">
            </div>

            <div class="mb-3">
              <label for="password1" class="form-label">Contraseña</label>
              <input type="password" id="password1" name="password1" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="password2" class="form-label">Confirmar contraseña</label>
              <input type="password" id="password2" name="password2" class="form-control" required>
            </div>

            <button class="btn w-100" 
                    style="background-color: var(--primary-color); border-color: var(--primary-color); color: #fff;">
              Registrarse
            </button>
          </form>

          <p class="text-center mt-4">
            ¿Ya tienes cuenta? 
            <a href="{% url 'iniciar_sesion' %}" style="color: var(--secondary-color);">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
