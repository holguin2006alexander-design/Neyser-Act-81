{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<main class="container-main">
    <div class="card p-4" style="max-width: 500px; margin: auto;">
        <h2 style="color: var(--primary-color);">Iniciar sesión</h2>

        <form method="POST">
            {% csrf_token %}

            <label class="mt-3">Usuario</label>
            <input type="text" name="username" class="form-control">

            <label class="mt-3">Contraseña</label>
            <input type="password" name="password" class="form-control">

            <button class="btn btn-primary mt-4" style="background: var(--primary-color);" type="submit">
                Entrar
            </button>
        </form>
    </div>
</main>
{% endblock %}
